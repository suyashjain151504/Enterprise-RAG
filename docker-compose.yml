services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adv_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/adv_rag
      - QDRANT_URL=http://qdrant:6333
      - UPSTASH_REDIS_URL=${UPSTASH_REDIS_URL}
      - UPSTASH_REDIS_TOKEN=${UPSTASH_REDIS_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Local llama.cpp on the Windows host. Gemini path does not use this.
      # 127.0.0.1 inside this container is NOT the host — must be host.docker.internal.
      - LLM_BASE_URL=http://host.docker.internal:8080/v1
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_JSON=false
      - LOG_LEVEL=INFO
      # Self-RAG / reflection tuning (overridable via host .env)
      - REFLECTION_MIN_SCORE=${REFLECTION_MIN_SCORE:-0.85}
      - MAX_REFLECTION_RETRIES=${MAX_REFLECTION_RETRIES:-2}
      - AUTH_REGISTER_RATE_LIMIT_PER_HOUR=${AUTH_REGISTER_RATE_LIMIT_PER_HOUR}
      - AUTH_LOGIN_RATE_LIMIT_PER_MIN=${AUTH_LOGIN_RATE_LIMIT_PER_MIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./seed:/app/seed
    command: ["python", "scripts/serve.py"]


volumes:
  postgres_data:
  qdrant_data: